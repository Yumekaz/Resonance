<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resonance Library</title>
  <link rel="stylesheet" href="/library.css">
  <script src="/library.js" defer></script>
  <script src="/user-library.js" defer></script>
</head>
<body>
  <header><div><p class="eyebrow">PROJECT RESONANCE</p><h1>Library</h1></div><a href="/demo">Diagnostic player</a></header>
  <main>
    <nav aria-label="Library views"><button data-view="tracks" aria-current="page">Tracks</button><button data-view="artists">Artists</button><button data-view="albums">Albums</button><button data-view="queue">Queue</button><button data-view="playlists">Playlists</button><button data-view="favorites">Favorites</button><button data-view="history">History</button></nav>
    <p id="view-title" class="section-title">Tracks</p>
    <div id="queue-controls" class="view-controls" hidden><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button><button id="clear-queue" type="button">Clear queue</button></div>
    <form id="playlist-create" class="view-controls" hidden><label for="playlist-name">New playlist</label><input id="playlist-name" maxlength="256" required><button type="submit">Create</button></form>
    <div id="track-actions" class="view-controls"><label for="playlist-target">Add Tracks to playlist</label><select id="playlist-target"><option value="">Choose playlist</option></select></div>
    <p id="status" role="status">Loading library…</p>
    <ul id="items" aria-label="Catalog entries"></ul>
    <button id="more" type="button" hidden>Load more</button>
  </main>
  <aside aria-label="Persistent player">
    <div class="now"><img id="cover" alt="" hidden><div><span class="eyebrow">NOW PLAYING</span><strong id="now-title">Choose an available track</strong><span id="now-credit"></span></div></div>
    <div class="player-controls"><button id="player-previous" type="button">Previous</button><audio id="audio" controls preload="metadata"></audio><button id="player-next" type="button">Next</button></div>
    <p id="player-error" role="alert" hidden></p>
  </aside>
</body>
</html>
